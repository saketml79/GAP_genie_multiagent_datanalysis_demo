resources:
  jobs:
    supply_chain_demo_setup:
      name: "[${bundle.target}] GAP Supply Chain Demo Setup"
      tasks:
        - task_key: 01_create_catalog_schemas
          notebook_task:
            notebook_path: ../src/01_create_catalog_schemas.py
            base_parameters:
              catalog_name: ${var.catalog_name}
          new_cluster:
            spark_version: 15.4.x-scala2.12
            num_workers: 0
            node_type_id: Standard_DS3_v2
            spark_conf:
              spark.master: "local[*, 4]"

        - task_key: 02_generate_demand_data
          depends_on:
            - task_key: 01_create_catalog_schemas
          notebook_task:
            notebook_path: ../src/02_generate_demand_data.py
            base_parameters:
              catalog_name: ${var.catalog_name}
          new_cluster:
            spark_version: 15.4.x-scala2.12
            num_workers: 0
            node_type_id: Standard_DS3_v2
            spark_conf:
              spark.master: "local[*, 4]"

        - task_key: 03_generate_inventory_data
          depends_on:
            - task_key: 01_create_catalog_schemas
          notebook_task:
            notebook_path: ../src/03_generate_inventory_data.py
            base_parameters:
              catalog_name: ${var.catalog_name}
          new_cluster:
            spark_version: 15.4.x-scala2.12
            num_workers: 0
            node_type_id: Standard_DS3_v2
            spark_conf:
              spark.master: "local[*, 4]"

        - task_key: 04_generate_logistics_data
          depends_on:
            - task_key: 01_create_catalog_schemas
          notebook_task:
            notebook_path: ../src/04_generate_logistics_data.py
            base_parameters:
              catalog_name: ${var.catalog_name}
          new_cluster:
            spark_version: 15.4.x-scala2.12
            num_workers: 0
            node_type_id: Standard_DS3_v2
            spark_conf:
              spark.master: "local[*, 4]"

        - task_key: 05_generate_supplier_data
          depends_on:
            - task_key: 01_create_catalog_schemas
          notebook_task:
            notebook_path: ../src/05_generate_supplier_data.py
            base_parameters:
              catalog_name: ${var.catalog_name}
          new_cluster:
            spark_version: 15.4.x-scala2.12
            num_workers: 0
            node_type_id: Standard_DS3_v2
            spark_conf:
              spark.master: "local[*, 4]"

        - task_key: 06_create_reporting_views
          depends_on:
            - task_key: 02_generate_demand_data
            - task_key: 03_generate_inventory_data
            - task_key: 04_generate_logistics_data
            - task_key: 05_generate_supplier_data
          notebook_task:
            notebook_path: ../src/06_create_reporting_views.py
            base_parameters:
              catalog_name: ${var.catalog_name}
          new_cluster:
            spark_version: 15.4.x-scala2.12
            num_workers: 0
            node_type_id: Standard_DS3_v2
            spark_conf:
              spark.master: "local[*, 4]"

        - task_key: 07_add_all_comments
          depends_on:
            - task_key: 06_create_reporting_views
          notebook_task:
            notebook_path: ../src/07_add_all_comments.py
            base_parameters:
              catalog_name: ${var.catalog_name}
          new_cluster:
            spark_version: 15.4.x-scala2.12
            num_workers: 0
            node_type_id: Standard_DS3_v2
            spark_conf:
              spark.master: "local[*, 4]"

        - task_key: 08_setup_genie_supervisor
          depends_on:
            - task_key: 07_add_all_comments
          notebook_task:
            notebook_path: ../src/08_setup_genie_supervisor.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              warehouse_id: ${var.warehouse_id}
          new_cluster:
            spark_version: 15.4.x-scala2.12
            num_workers: 0
            node_type_id: Standard_DS3_v2
            spark_conf:
              spark.master: "local[*, 4]"
