<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supply Chain Control Tower</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
      background:linear-gradient(135deg,#f0f4f8 0%,#e8edf5 50%,#f5f7fa 100%);
      color:#1e293b;display:flex;flex-direction:column;justify-content:center;align-items:center;
      min-height:100vh;overflow:hidden;
    }
    body::before{
      content:'';position:fixed;inset:0;
      background-image:radial-gradient(circle at 1px 1px,rgba(99,102,241,.05) 1px,transparent 0);
      background-size:48px 48px;pointer-events:none;
    }
    .card{
      background:rgba(255,255,255,.92);backdrop-filter:blur(24px);
      border:1px solid rgba(99,102,241,.12);border-radius:24px;
      padding:52px 48px;max-width:520px;width:92%;text-align:center;
      box-shadow:0 12px 48px rgba(99,102,241,.08),0 4px 16px rgba(0,0,0,.06);
    }
    .logo{
      width:56px;height:56px;border-radius:16px;
      background:linear-gradient(135deg,#14b8a6,#6366f1);
      display:inline-flex;align-items:center;justify-content:center;
      font-size:24px;font-weight:800;color:#fff;margin-bottom:18px;
    }
    h1{font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-.02em}
    .sub{color:#64748b;font-size:14px;margin-bottom:36px}
    .spinner{
      width:44px;height:44px;border:3.5px solid rgba(99,102,241,.15);
      border-top-color:#0d9488;border-radius:50%;
      animation:spin .9s linear infinite;margin:0 auto 22px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
    #status{
      font-size:15px;color:#4f46e5;font-weight:600;
      min-height:24px;margin-bottom:14px;
    }
    #status.deploying{animation:pulse 1.8s ease-in-out infinite}
    .track{
      height:5px;background:rgba(99,102,241,.1);border-radius:3px;
      overflow:hidden;margin-bottom:10px;
    }
    .fill{
      height:100%;border-radius:3px;transition:width .6s ease;
      background:linear-gradient(90deg,#14b8a6,#6366f1,#a78bfa);
      background-size:200% 100%;animation:shimmer 2s linear infinite;
    }
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .fill.done{animation:none;background:#14b8a6}
    #detail{color:#64748b;font-size:11.5px;font-family:'Cascadia Code',monospace;min-height:16px}
    .ready{color:#0d9488 !important;animation:none !important}
    .error{color:#f43f5e !important;animation:none !important}
    .hidden{display:none}
    #enter-btn{
      display:inline-block;margin-top:28px;padding:14px 40px;font-size:16px;
      font-weight:700;border:none;border-radius:14px;text-decoration:none;
      background:linear-gradient(135deg,#14b8a6,#0d9488);color:#fff;
      cursor:pointer;transition:transform .15s,box-shadow .15s;
      box-shadow:0 4px 20px rgba(20,184,166,.25);
    }
    #enter-btn:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(20,184,166,.4)}
    .steps{
      display:flex;gap:8px;justify-content:center;margin:24px 0 8px;flex-wrap:wrap;
    }
    .step{
      font-size:11px;padding:4px 12px;border-radius:999px;
      border:1px solid rgba(99,102,241,.15);color:#64748b;
      transition:border-color .4s,color .4s,background .4s;
    }
    .step.active{border-color:#0d9488;color:#0d9488;background:rgba(20,184,166,.08)}
    .step.done{border-color:rgba(13,148,136,.4);color:#0f766e;background:rgba(20,184,166,.06)}
    #deploy-detail{
      margin-top:14px;padding:10px 14px;border-radius:10px;
      background:rgba(99,102,241,.05);border:1px solid rgba(99,102,241,.1);
      font-size:12px;color:#4f46e5;font-family:'Cascadia Code',monospace;
      text-align:left;line-height:1.6;max-height:120px;overflow-y:auto;
    }
    #deploy-detail .line{opacity:.5}
    #deploy-detail .line.current{opacity:1;font-weight:600}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">SC</div>
  <h1>Supply Chain Control Tower</h1>
  <p class="sub">Genie Curator Workbench</p>

  <div id="spinner" class="spinner"></div>
  <div id="status">Connecting&hellip;</div>
  <div class="track"><div id="bar" class="fill" style="width:3%"></div></div>
  <div id="detail"></div>

  <div class="steps">
    <span id="s1" class="step">Check</span>
    <span id="s2" class="step">Deploy</span>
    <span id="s3" class="step">Start</span>
    <span id="s4" class="step">Initialize</span>
    <span id="s5" class="step">Ready</span>
  </div>

  <div id="deploy-detail" class="hidden"></div>

  <a id="enter-btn" class="hidden" href="">Enter Workbench &rarr;</a>
</div>

<div id="error-box" class="hidden" style="
  max-width:520px;width:92%;margin-top:16px;
  background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.25);
  border-radius:14px;padding:18px 22px;text-align:left;
  font-size:13px;color:#9f1239;font-family:'Cascadia Code',monospace;
  word-break:break-word;
">
  <div style="font-weight:700;margin-bottom:6px;font-family:'Segoe UI',system-ui,sans-serif;">Error Details</div>
  <div id="error-text"></div>
  <div style="margin-top:10px;font-family:'Segoe UI',system-ui,sans-serif;color:#64748b;font-size:12px;">Refresh the page to retry.</div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let targetUrl = "";
  let startTime = Date.now();
  const POLL_MS = 3500;
  const DEPLOY_POLL_MS = 2500;
  const MAX_WAIT_MS = 600000; // 10 min for deploys
  let deployPhases = [];

  function setStep(n){
    for(let i=1;i<=5;i++){
      const el = $("s"+i);
      el.classList.remove("active","done");
      if(i<n) el.classList.add("done");
      else if(i===n) el.classList.add("active");
    }
  }
  function setProgress(pct, msg, detail, deploying){
    $("bar").style.width = pct+"%";
    if($("bar").classList.contains("done")) $("bar").classList.remove("done");
    $("status").textContent = msg;
    if(deploying) $("status").classList.add("deploying");
    else $("status").classList.remove("deploying");
    $("detail").textContent = detail || "";
  }
  function addDeployPhase(msg){
    if(!msg) return;
    // De-dup
    const clean = msg.replace(/\.\.\.$/, "").trim();
    if(deployPhases.length && deployPhases[deployPhases.length-1] === clean) return;
    deployPhases.push(clean);
    renderDeployLog();
  }
  function renderDeployLog(){
    const box = $("deploy-detail");
    box.classList.remove("hidden");
    box.innerHTML = deployPhases.map((p,i) => {
      const isCurrent = i === deployPhases.length - 1;
      const icon = isCurrent ? "\u25B6" : "\u2713";
      return `<div class="line ${isCurrent ? 'current' : ''}">${icon} ${p}</div>`;
    }).join("");
    box.scrollTop = box.scrollHeight;
  }
  function showReady(){
    $("spinner").classList.add("hidden");
    $("status").textContent = "App is ready!";
    $("status").classList.add("ready");
    $("status").classList.remove("deploying");
    $("bar").style.width = "100%";
    $("bar").classList.add("done");
    $("detail").textContent = "";
    $("deploy-detail").classList.add("hidden");
    setStep(5);
    const btn = $("enter-btn");
    btn.href = targetUrl;
    btn.classList.remove("hidden");
    setTimeout(() => { window.location.href = targetUrl; }, 2200);
  }
  function showError(msg, detail){
    $("spinner").classList.add("hidden");
    $("status").textContent = msg;
    $("status").classList.add("error");
    $("status").classList.remove("deploying");
    $("detail").textContent = "";
    var box = $("error-box");
    $("error-text").textContent = detail || msg;
    box.classList.remove("hidden");
  }
  async function api(path, method){
    const r = await fetch(path, {method: method||"GET"});
    return r.json();
  }

  function elapsed(){ return Math.round((Date.now() - startTime) / 1000); }
  function fmtElapsed(s){ return s >= 60 ? Math.floor(s/60)+"m "+String(s%60).padStart(2,"0")+"s" : s+"s"; }

  async function pollReady(){
    setStep(4);
    const readyPoll = setInterval(async () => {
      const el = elapsed();
      try {
        const rr = await fetch("/api/ready");
        const rd = await rr.json();
        if(rd.ready){
          clearInterval(readyPoll);
          showReady();
          return;
        }
        setProgress(88, "Initializing UI\u2026", fmtElapsed(el) + " \u2022 HTTP " + (rd.status||"pending"), false);
      } catch(e) {
        setProgress(86, "Checking UI\u2026", fmtElapsed(el), false);
      }
      if(Date.now() - startTime > MAX_WAIT_MS){
        clearInterval(readyPoll);
        showReady(); // fallback: let user click
      }
    }, 3000);
  }

  async function main(){
    try {
      const cfg = await api("/api/config");
      targetUrl = cfg.targetUrl;
    } catch(e) {
      showError("Cannot reach landing server.");
      return;
    }

    // Step 1: Check status
    setStep(1);
    setProgress(8, "Checking app status\u2026", "", false);
    let d;
    try {
      const r = await fetch("/api/status");
      d = await r.json();
      if(!r.ok) {
        showError("Status check failed (" + r.status + ")", d.message || JSON.stringify(d));
        return;
      }
    } catch(e) {
      showError("Status check failed", e.message);
      return;
    }
    const state = (d.state || "").toUpperCase();

    // If a deployment is in progress, enter deploy-watch flow
    if(d.deploying){
      setStep(2);
      addDeployPhase("Deployment in progress");
      if(d.deploy_message) addDeployPhase(d.deploy_message);
      setProgress(15, "Deploying new version\u2026", d.deploy_message || "Preparing\u2026", true);
      pollDeploy();
      return;
    }

    if(state === "ACTIVE" || state === "RUNNING"){
      setProgress(85, "App compute is up \u2014 checking UI\u2026", "", false);
      setStep(3);
      pollReady();
      return;
    }

    // Step 2/3: Wake it up
    setStep(3);
    if(["STOPPED","CRASHED","IDLE","ERROR"].includes(state)){
      setProgress(15, "App is " + state.toLowerCase() + " \u2014 starting\u2026", d.message, false);
      try {
        const sr = await fetch("/api/start", {method:"POST"});
        const sd = await sr.json();
        if(!sr.ok || sd.ok === false){
          showError("Failed to start (" + sr.status + ")", sd.message || JSON.stringify(sd));
          return;
        }
      } catch(e) {
        showError("Failed to start", e.message);
        return;
      }
    } else {
      setProgress(15, "App status: " + state + " \u2014 waiting\u2026", d.message, false);
    }

    // Poll until ACTIVE
    pollCompute();
  }

  function pollDeploy(){
    /* Poll status with deploy awareness — stays in deploy step until pending_deployment clears. */
    const poll = setInterval(async () => {
      const el = elapsed();
      const pct = Math.min(15 + (el / (MAX_WAIT_MS/1000)) * 70, 80);
      let pd;
      try {
        const pr = await fetch("/api/status");
        pd = await pr.json();
        if(!pr.ok){
          setProgress(pct, "Deploying\u2026", fmtElapsed(el) + " \u2022 status " + pr.status, true);
          return;
        }
      } catch(e) {
        setProgress(pct, "Deploying\u2026", fmtElapsed(el) + " \u2022 connection retry", true);
        return;
      }
      const st = (pd.state || "").toUpperCase();

      if(pd.deploying){
        // Still deploying
        if(pd.deploy_message) addDeployPhase(pd.deploy_message);
        setProgress(pct, "Deploying new version\u2026", fmtElapsed(el) + " \u2022 " + (pd.deploy_message || st), true);
        setStep(2);
        return;
      }

      // Deploy finished — now check compute state
      addDeployPhase("Deployment complete");
      if(st === "ACTIVE" || st === "RUNNING"){
        clearInterval(poll);
        setProgress(85, "App compute is up \u2014 checking UI\u2026", fmtElapsed(el), false);
        pollReady();
        return;
      }
      if(st === "STOPPED" || st === "IDLE"){
        // Deploy done but compute stopped — start it
        clearInterval(poll);
        setStep(3);
        addDeployPhase("Starting compute\u2026");
        setProgress(40, "Starting app\u2026", fmtElapsed(el), false);
        try {
          await fetch("/api/start", {method:"POST"});
        } catch(e) { /* will be caught in next poll */ }
        pollCompute();
        return;
      }
      if(st === "STARTING" || st === "RESUMING"){
        setStep(3);
        addDeployPhase("Compute starting\u2026");
        setProgress(pct, "Starting compute\u2026", fmtElapsed(el) + " \u2022 " + st, false);
        return;
      }
      if(st === "CRASHED" || st === "ERROR"){
        clearInterval(poll);
        showError("App " + st.toLowerCase() + " after deploy. Check logs in the Databricks Apps UI.", pd.message);
        return;
      }
      setProgress(pct, "Deploying\u2026", fmtElapsed(el) + " \u2022 " + st, true);

      if(Date.now() - startTime > MAX_WAIT_MS){
        clearInterval(poll);
        showError("Timed out after 10 minutes. Try refreshing or check the Apps UI.");
      }
    }, DEPLOY_POLL_MS);
  }

  function pollCompute(){
    /* Poll until compute is ACTIVE, then switch to UI-ready check. */
    setStep(3);
    const poll = setInterval(async () => {
      const el = elapsed();
      const pct = Math.min(18 + (el / (MAX_WAIT_MS/1000)) * 75, 85);
      let pd;
      try {
        const pr = await fetch("/api/status");
        pd = await pr.json();
        if(!pr.ok){
          setProgress(pct, "Waiting\u2026", fmtElapsed(el) + " \u2022 status " + pr.status, false);
          return;
        }
      } catch(e) {
        setProgress(pct, "Waiting\u2026", fmtElapsed(el) + " \u2022 connection retry", false);
        return;
      }
      const st = (pd.state || "").toUpperCase();

      // If a new deploy started mid-poll, switch to deploy flow
      if(pd.deploying){
        clearInterval(poll);
        addDeployPhase("New deployment detected");
        if(pd.deploy_message) addDeployPhase(pd.deploy_message);
        setProgress(20, "Deploying new version\u2026", pd.deploy_message || "", true);
        setStep(2);
        pollDeploy();
        return;
      }

      if(st === "ACTIVE" || st === "RUNNING"){
        clearInterval(poll);
        setProgress(85, "App compute is up \u2014 waiting for UI\u2026", fmtElapsed(el), false);
        pollReady();
        return;
      }
      if(st === "CRASHED" || st === "ERROR"){
        clearInterval(poll);
        showError("App crashed (" + st + "). Check logs in the Databricks Apps UI.");
        return;
      }
      setProgress(pct, "Starting up\u2026", fmtElapsed(el) + " \u2022 " + st, false);

      if(Date.now() - startTime > MAX_WAIT_MS){
        clearInterval(poll);
        showError("Timed out after 10 minutes. Try refreshing or check the Apps UI.");
      }
    }, POLL_MS);
  }

  main();
})();
</script>
</body>
</html>
